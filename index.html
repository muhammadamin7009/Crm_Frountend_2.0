<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Bu teglar aynan shu yerda — serverdan qaytadigan HTML ichida — turishi
      kerak. Telegram, Instagram, LinkedIn va Facebook havolani ochganda
      JavaScript ishlatmaydi: ular faqat <head> ni o'qiydi. Shuning uchun
      React ichida qo'yilgan teg ularga hech qachon yetib bormaydi.
    -->
    <title>Al-amin — ishlab chiqarish korxonalari uchun ERP tizimi</title>
    <meta
      name="description"
      content="Xomashyo xaridi, ombor, ishlab chiqarish, sotuv, qarzdorliklar va ish haqi — bitta tizimda. Ishlab chiqarish korxonalari uchun ERP."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Al-amin ERP" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:title" content="Al-amin — ishlab chiqarish uchun ERP tizimi" />
    <meta
      property="og:description"
      content="Xomashyodan tayyor mahsulotgacha butun jarayon va har bir so'm nazorat ostida."
    />
    <meta property="og:image" content="https://al-amin.uz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Al-amin ERP boshqaruv paneli" />
    <meta property="og:url" content="https://al-amin.uz/landing" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Al-amin — ishlab chiqarish uchun ERP tizimi" />
    <meta
      name="twitter:description"
      content="Xomashyodan tayyor mahsulotgacha butun jarayon va har bir so'm nazorat ostida."
    />
    <meta name="twitter:image" content="https://al-amin.uz/og-image.png" />

    <meta name="theme-color" content="#6e1622" />
    <link rel="canonical" href="https://al-amin.uz/landing" />

    <!--
      Mavzuni React yuklanishidan oldin qo'yamiz. Aks holda sahifa avval oq
      chizilib, keyin qorayadi — bu lipillash landing sahifasida ayniqsa
      ko'zga tashlanadi, chunki u oldindan chizilgan HTML bilan darrov
      ochiladi. ThemeContext keyinchalik shu qiymatnigina tasdiqlaydi.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("al-amin-theme");
          var mode =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
